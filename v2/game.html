<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game — Hockey Goal Announcer</title>
    <link rel="icon" href="../favicon.png" type="image/png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .game-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }
        .game-header {
            background: #ffffff;
            border-radius: 0;
            padding: 0 0 20px 0;
            margin-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: none;
        }
        .game-header h1 {
            color: #0f172a;
            margin-bottom: 8px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .game-info {
            color: #64748b;
            margin-bottom: 0;
            font-size: 0.9375rem;
        }
        .back-btn {
            padding: 8px 14px;
            background: #ffffff;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .back-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #0f172a;
        }
        .section-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
            box-shadow: none;
        }
        .section-card h2 {
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 18px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-weight: 500;
            font-size: 0.875rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.9375rem;
            box-sizing: border-box;
            background: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .goal-item {
            background: #fafafa;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .goal-info {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .goal-team {
            padding: 6px 12px;
            border-radius: 6px;
            color: #0f172a;
            font-weight: 600;
            font-size: 0.9375rem;
            text-transform: none;
            letter-spacing: 0;
            box-shadow: none;
            border: 1px solid rgba(0,0,0,0.08);
        }
        .goal-actions {
            display: flex;
            gap: 10px;
        }
        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #fecaca;
            font-size: 0.875rem;
        }
        .success-message {
            background: #f0fdf4;
            color: #15803d;
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #bbf7d0;
            font-size: 0.875rem;
        }
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .tab {
            padding: 10px 18px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
            font-size: 0.9375rem;
            font-weight: 500;
            color: #64748b;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .tab:hover {
            color: #0f172a;
        }
        .tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }
        .tab-content {
            display: none;
            padding-top: 20px;
        }
        .tab-content.active {
            display: block;
        }
        /* Attending tab: stack teams vertically; each team is its own card (no shared multi-column grid). */
        .attending-players-root {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 4px 2px 12px;
        }
        .attending-team-group {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: #fafafa;
            box-shadow: none;
        }
        .attending-team-group__header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #fff;
            border-left: 4px solid var(--team-accent, #2563eb);
            border-bottom: 1px solid #e5e7eb;
        }
        .attending-team-group__badge {
            display: inline-block;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: normal;
            text-transform: none;
            color: #fff;
            background: var(--team-accent, #3498db);
            padding: 8px 14px;
            border-radius: 10px;
            max-width: 100%;
            line-height: 1.35;
            box-sizing: border-box;
        }
        .attending-team-group__list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 14px 16px 16px;
        }
        .attending-player-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }
        .attending-player-row label {
            flex: 1;
            margin: 0;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

        <div class="game-header">
            <h1 id="gameTitle">Loading Game...</h1>
            <div class="game-info" id="gameInfo"></div>
        </div>

        <div id="gameMessage"></div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchGameTab('attending')">Attending Players</button>
            <button class="tab" onclick="switchGameTab('goals')">Record Goal</button>
        </div>

        <!-- Attending Players Tab -->
        <div id="attending-tab" class="tab-content active">
            <div class="section-card">
                <h2>Select attending players</h2>
                <div id="attendingMessage"></div>
                <div id="attendingPlayersCheckboxes" class="attending-players-root"></div>
                <button class="btn btn-primary" onclick="saveAttendingPlayers()" style="margin-top: 15px;">Save Attending Players</button>
            </div>
        </div>

        <!-- Record Goal Tab -->
        <div id="goals-tab" class="tab-content">
            <!-- Record Goal Section -->
            <div class="section-card">
                <h2>Record Goal</h2>
                <form id="goalForm" onsubmit="recordGoal(event)">
                <div class="form-group">
                    <label for="scoringTeam">Scoring Team:</label>
                    <select id="scoringTeam" onchange="updatePlayerDropdowns()"></select>
                </div>

                <div class="form-group">
                    <label for="scorer">Scorer:</label>
                    <select id="scorer" required>
                        <option value="">Select scorer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="assist1">Assist 1 (Optional):</label>
                    <select id="assist1">
                        <option value="">No assist</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="assist2">Assist 2 (Optional):</label>
                    <select id="assist2">
                        <option value="">No assist</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="period">Period:</label>
                        <select id="period" required>
                            <option value="1">1st Period</option>
                            <option value="2">2nd Period</option>
                            <option value="3">3rd Period</option>
                            <option value="ot">Overtime</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="timeRemaining">Time Remaining:</label>
                        <input type="text" id="timeRemaining" placeholder="MM:SS" value="4:25" required>
                    </div>
                </div>

                    <button type="submit" class="btn btn-primary">Record Goal</button>
                </form>
            </div>

            <!-- Voice Selection Section -->
            <div class="section-card">
                <h2>Voice Selection</h2>
                <div class="form-group">
                    <label for="voiceSelect">Select Voice for Announcements:</label>
                    <select id="voiceSelect" class="form-group select">
                        <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Female, American)</option>
                        <option value="AZnzlk1XvdvUeBnXmlld">Domi (Female, American)</option>
                        <option value="EXAVITQu4vr4xnSDxMaL">Bella (Female, American)</option>
                        <option value="ErXwobaYiN019PkySvjV" selected>Antoni (Male, American)</option>
                        <option value="MF3mGyEYCl7XYWbV9V6O">Elli (Female, American)</option>
                        <option value="TxGEqnHWrfWFTfGW9XjX">Josh (Male, American)</option>
                        <option value="VR6AewLTigWG4xSOukaG">Arnold (Male, American)</option>
                        <option value="pNInz6obpgDQGcFmaJgB">Adam (Male, American)</option>
                        <option value="yoZ06aMxZJJ28mfd3POQ">Sam (Male, American)</option>
                        <option value="pqHfZKP75CvOlQylNhV4">Bill (Male, American)</option>
                        <option value="XB0fDUnXU5T4t4nJZ0KL">Daniel (Male, British)</option>
                        <option value="VR6AewLTigWG4xSOukaG">Charlotte (Female, British)</option>
                        <option value="gU0LNdkMOQCOrPrwtbee">British Football Announcer (Custom Voice)</option>
                        <option value="KLoixBflzS2a9rg6nT8x">Radio DJ</option>
                    </select>
                </div>
            </div>

            <!-- Goals List Section -->
            <div class="section-card">
                <h2>Goal Log</h2>
                <div id="goalsList"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
