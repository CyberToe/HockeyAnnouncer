<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Hockey Goal Announcer</title>
    <link rel="icon" href="../favicon.png" type="image/png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 16px;
            margin-bottom: 24px; padding-bottom: 20px;
            border-bottom: 2px solid #94a3b8;
        }
        .dashboard-header h1 { font-size: 1.5rem; font-weight: 600; color: #0f172a; margin: 0; letter-spacing: -0.02em; }
        .user-info { color: #64748b; font-size: 0.9375rem; margin-right: 12px; }
        .logout-btn {
            padding: 8px 14px; background: #ffffff; color: #64748b; border: 2px solid #94a3b8;
            border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500;
        }
        .logout-btn:hover { background: #f8fafc; color: #0f172a; border-color: #64748b; }
        .tabs {
            display: flex; gap: 0; margin-bottom: 0;
            border-bottom: 2px solid #94a3b8;
        }
        .tab {
            padding: 10px 18px; background: transparent; border: none;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            cursor: pointer; font-size: 0.9375rem; font-weight: 500; color: #64748b;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
        .tab:hover { color: #0f172a; }
        .tab-content { display: none; padding-top: 20px; }
        .tab-content.active { display: block; }
        .section-card {
            background: #ffffff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
            border: 2px solid #94a3b8;
        }
        .section-card h2 {
            color: #0f172a; font-size: 1.25rem; font-weight: 600; margin-bottom: 18px;
            border-bottom: 2px solid #94a3b8; padding-bottom: 12px;
        }
        .section-card h3 { color: #334155; font-size: 1.05rem; font-weight: 600; margin: 20px 0 12px; }
        .section-card h4 { color: #475569; font-size: 0.95rem; font-weight: 600; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #334155; font-weight: 500; font-size: 0.875rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 2px solid #94a3b8; border-radius: 6px;
            font-size: 0.9375rem; box-sizing: border-box; background: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .players-list {
            margin-top: 16px; border: 2px solid #94a3b8; border-radius: 8px; padding: 12px;
            max-height: 300px; overflow-y: auto; background: #fafafa;
        }
        .player-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 8px; border-bottom: 2px solid #94a3b8;
        }
        .player-item:last-child { border-bottom: none; }
        .game-item {
            background: #fafafa; border: 2px solid #94a3b8; border-radius: 8px; padding: 16px 18px;
            margin-bottom: 12px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease;
        }
        .game-item:hover { background: #f1f5f9; border-color: #64748b; }
        .error-message {
            background: #fef2f2; color: #b91c1c; padding: 12px 14px; border-radius: 6px; margin-bottom: 15px;
            border: 2px solid #dc2626; font-size: 0.875rem;
        }
        .success-message {
            background: #f0fdf4; color: #15803d; padding: 12px 14px; border-radius: 6px; margin-bottom: 15px;
            border: 2px solid #16a34a; font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Hockey Goal Announcer</h1>
            <div>
                <span class="user-info" id="userEmail"></span>
                <button type="button" class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('teams')">Teams</button>
            <button class="tab" onclick="switchTab('games')">Games</button>
        </div>

        <div id="teams" class="tab-content active">
            <div class="section-card">
                <h2>Teams</h2>
                <div id="teamsMessage"></div>

                <h3>Create team</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="newTeamName">Team name</label>
                        <input type="text" id="newTeamName" placeholder="Enter team name">
                    </div>
                    <div class="form-group">
                        <label for="newTeamColor">Team color</label>
                        <input type="color" id="newTeamColor" value="#4ecdc4">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="createTeam()">Create team</button>

                <h3 style="margin-top: 30px;">Select team</h3>
                <div class="form-group">
                    <label for="teamSelector">Choose team</label>
                    <select id="teamSelector" onchange="selectTeam()">
                        <option value="">-- Select a team to view or edit --</option>
                    </select>
                </div>

                <div id="selectedTeamDetails" style="display: none; margin-top: 20px;">
                    <h3>Team details</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editTeamName">Team name</label>
                            <input type="text" id="editTeamName" placeholder="Enter team name">
                        </div>
                        <div class="form-group">
                            <label for="editTeamColor">Team color</label>
                            <input type="color" id="editTeamColor" value="#4ecdc4">
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <button class="btn btn-primary" onclick="updateTeam()">Update team</button>
                        <button class="btn btn-danger" onclick="deleteSelectedTeam()" style="margin-left: 10px;">Delete team</button>
                    </div>

                    <h4 style="margin-top: 20px;">Players</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="selectedPlayerName">Player name</label>
                            <input type="text" id="selectedPlayerName" placeholder="Enter player name">
                        </div>
                        <div class="form-group">
                            <label for="selectedPlayerNumber">Number</label>
                            <input type="number" id="selectedPlayerNumber" placeholder="1–99" min="1" max="99">
                        </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="addSelectedTeamPlayer()" style="margin-bottom: 15px;">Add player</button>
                    <div id="selectedTeamPlayers" class="players-list"></div>
                </div>
            </div>
        </div>

        <div id="games" class="tab-content">
            <div class="section-card">
                <h2>Games</h2>
                <div id="gamesMessage"></div>
                <h3>Create game</h3>
                <div class="form-group">
                    <label for="newGameName">Game name (optional)</label>
                    <input type="text" id="newGameName" placeholder="e.g. Tuesday league">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="newGameTeamA">First team</label>
                        <select id="newGameTeamA">
                            <option value="">Select team</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="newGameTeamB">Second team</label>
                        <select id="newGameTeamB">
                            <option value="">Select team</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="createGame()">Create game</button>

                <h3 style="margin-top: 30px;">Games list</h3>
                <div id="gamesList"></div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
